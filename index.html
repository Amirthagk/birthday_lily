<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Haryni</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Montserrat:wght@300;400&family=Great+Vibes&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Intro overlay for interaction -->
    <div id="intro-overlay" class="overlay">
        <h1 class="intro-text">Touch the magic to begin</h1>
    </div>

    <!-- Background canvas for fireflies -->
    <canvas id="fireflies"></canvas>

    <!-- Main Container -->
    <div id="main-container" class="hidden">
        
        <!-- SVG Lily -->
        <div class="flower-container">
            <svg id="lily-svg" viewBox="0 0 400 600" xmlns="http://www.w3.org/2000/svg">
                <!-- Glow Filters -->
                <defs>
                    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                        <feGaussianBlur stdDeviation="8" result="blur" />
                        <feComposite in="SourceGraphic" in2="blur" operator="over" />
                    </filter>
                    <filter id="soft-glow" x="-50%" y="-50%" width="200%" height="200%">
                        <feGaussianBlur stdDeviation="15" result="blur" />
                        <feComposite in="SourceGraphic" in2="blur" operator="over" />
                    </filter>
                    
                    <!-- Gradients -->
                    <linearGradient id="stem-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#4CAF50" />
                        <stop offset="100%" stop-color="#1b5e20" />
                    </linearGradient>
                    <radialGradient id="petal-gradient" cx="50%" cy="100%" r="100%">
                        <stop offset="0%" stop-color="#fff" />
                        <stop offset="40%" stop-color="#ffe8f4" />
                        <stop offset="100%" stop-color="#ffb6c1" />
                    </radialGradient>
                </defs>

                <!-- Stem -->
                <path id="stem" class="stem" d="M200 600 Q210 400 200 300" stroke="url(#stem-gradient)" stroke-width="6" fill="none" stroke-linecap="round"/>
                
                <!-- Leaves -->
                <path id="leaf-left" class="leaf" d="M205 500 Q150 480 120 400 Q160 450 205 480" fill="url(#stem-gradient)" opacity="0"/>
                <path id="leaf-right" class="leaf" d="M198 420 Q260 400 290 320 Q240 370 198 400" fill="url(#stem-gradient)" opacity="0"/>

                <!-- Petals Base/Receptacle -->
                <path id="base" class="petal" d="M190 300 Q200 320 210 300 Q200 295 190 300" fill="#4CAF50" opacity="0"/>

                <!-- Petals group -->
                <g id="bloom" transform="translate(200, 305) scale(0)">
                    <!-- Back petals -->
                    <path class="petal back-petal" d="M0 0 Q -40 -60 -30 -120 Q -10 -80 0 0" fill="url(#petal-gradient)" filter="url(#glow)"/>
                    <path class="petal back-petal" d="M0 0 Q 40 -60 30 -120 Q 10 -80 0 0" fill="url(#petal-gradient)" filter="url(#glow)"/>
                    
                    <!-- Side petals -->
                    <path class="petal side-petal" d="M0 0 Q -80 -40 -100 -90 Q -50 -30 0 0" fill="url(#petal-gradient)" filter="url(#glow)"/>
                    <path class="petal side-petal" d="M0 0 Q 80 -40 100 -90 Q 50 -30 0 0" fill="url(#petal-gradient)" filter="url(#glow)"/>
                    
                    <!-- Front petals -->
                    <path class="petal front-petal" d="M0 0 Q -20 -70 -10 -140 Q 10 -90 0 0" fill="url(#petal-gradient)" filter="url(#glow)"/>
                    <path class="petal front-petal" d="M0 0 Q 20 -70 10 -140 Q -10 -90 0 0" fill="url(#petal-gradient)" filter="url(#glow)"/>
                    
                    <!-- Center stamen -->
                    <path class="stamen" d="M0 0 Q -10 -50 -15 -80" stroke="#fdd835" stroke-width="2" fill="none" filter="url(#glow)"/>
                    <circle cx="-15" cy="-80" r="3" fill="#ffb300" filter="url(#glow)"/>
                    
                    <path class="stamen" d="M0 0 Q 5 -60 5 -90" stroke="#fdd835" stroke-width="2" fill="none" filter="url(#glow)"/>
                    <circle cx="5" cy="-90" r="3" fill="#ffb300" filter="url(#glow)"/>
                    
                    <path class="stamen" d="M0 0 Q 15 -45 20 -75" stroke="#fdd835" stroke-width="2" fill="none" filter="url(#glow)"/>
                    <circle cx="20" cy="-75" r="3" fill="#ffb300" filter="url(#glow)"/>
                </g>
            </svg>
        </div>

        <!-- Text Content -->
        <div id="text-container" class="hidden text-content">
            <h1 class="birthday-title">Happy Birthday Haryni</h1>
            <p class="birthday-message">
                May your day be as beautiful and glowing as this lily.<br>
                Wishing you a year filled with magic, happiness, and endless joy.<br>
                Keep shining and blooming in your own wonderful way.
            </p>
        </div>
    </div>

    <!-- Soft Piano Background Music (Using a free reliable CDN link for soft piano) -->
    <audio id="bg-music" loop>
        <source src="https://cdn.pixabay.com/audio/2022/05/27/audio_1808fbf07a.mp3" type="audio/mpeg">
    </audio>

    <script src="script.js"></script>
</body>
</html>
